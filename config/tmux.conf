# ─── General ───────────────────────────────────────────────────────────────
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"
set -g history-limit 50000
set -g display-time 4000
set -g status-interval 5
set -g focus-events on
setw -g aggressive-resize on
set -s escape-time 0         # no delay after Esc

# ─── Prefix: Ctrl-a (easier than Ctrl-b) ───────────────────────────────────
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# ─── Reload config ─────────────────────────────────────────────────────────
bind r source-file ~/.tmux.conf \; display "Config reloaded"

# ─── Windows & Panes ───────────────────────────────────────────────────────
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# Split with | and - (intuitive)
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# New window keeps CWD
bind c new-window -c "#{pane_current_path}"

# ─── Navigation ────────────────────────────────────────────────────────────
# vim-style pane switching
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Shift+arrow to switch windows
bind -n S-Left  previous-window
bind -n S-Right next-window

# ─── Mouse ─────────────────────────────────────────────────────────────────
set -g mouse on

# ─── Copy mode (vi) ────────────────────────────────────────────────────────
setw -g mode-keys vi
bind Enter copy-mode
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "xclip -in -selection clipboard"

# ─── Status Bar ────────────────────────────────────────────────────────────
set -g status-position bottom
set -g status-style "bg=#2c415b,fg=#ffffff"
set -g status-left " #[bold]#S  "
set -g status-left-length 20
set -g status-right "#[fg=#00a8f7]  %H:%M  #[fg=#aaaaaa]%d %b "
set -g status-right-length 30

setw -g window-status-format         " #I:#W "
setw -g window-status-current-format " #[bold,fg=#00c48c]#I:#W "

# ─── Pane borders ──────────────────────────────────────────────────────────
set -g pane-border-style        "fg=#2c415b"
set -g pane-active-border-style "fg=#00a8f7"

# ─── Plugins ───────────────────────────────────────────────────────────────
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# tmux-resurrect: also restore pane contents
set -g @resurrect-capture-pane-contents 'on'
set -g @resurrect-strategy-nvim 'session'

# tmux-continuum: auto-save every 10 min, auto-restore on start
set -g @continuum-restore 'on'
set -g @continuum-save-interval '10'

# ─── Init TPM (keep this last) ─────────────────────────────────────────────
run '~/.tmux/plugins/tpm/tpm'
